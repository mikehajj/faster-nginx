name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: |
        docker build . \
          --tag mikehajj/faster-nginx:latest \
          --tag mikehajj/faster-nginx:noble \
          --tag mikehajj/faster-nginx:24.04
    - name: Login to Docker
      run: docker login --username mikehajj --password $docker_pwd
      env: 
        docker_pwd: ${{ secrets.DOCKER_PWD }}
    - name: Push Image to Docker Hub
      # Only push on push events (not PRs)
      if: github.event_name == 'push'
      run: |
        docker push mikehajj/faster-nginx:latest
        docker push mikehajj/faster-nginx:noble
        docker push mikehajj/faster-nginx:24.04
